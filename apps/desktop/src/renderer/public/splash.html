<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Startup splash. Static + scriptless on purpose: the credit is plain text here, and the
      version is written in by the main process via `executeJavaScript` after load, so this page
      keeps the strictest possible policy (`script-src 'none'`) and cannot be made to run anything.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>MadY</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body {
        background: #16123a url("./splash.jpg") center / cover no-repeat;
        font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #fff;
        /* The window is frameless, so give the artwork a hairline edge of its own. */
        border: 1px solid rgba(255, 255, 255, 0.14);
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      /* Legibility: the artwork's left side is dark but not uniformly so (a faint dot
         grid and axis line run through it). A soft scrim guarantees contrast for the text
         without flattening the image — the same rule the figure backdrop follows. */
      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          rgba(8, 6, 26, 0.88) 0%,
          rgba(8, 6, 26, 0.72) 26%,
          rgba(8, 6, 26, 0.28) 50%,
          rgba(8, 6, 26, 0) 72%
        );
      }
      .wrap {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 0 0 52px;
      }
      .name {
        font-size: 62px;
        font-weight: 700;
        letter-spacing: -1.4px;
        line-height: 1;
        text-shadow: 0 2px 24px rgba(0, 0, 0, 0.55);
      }
      .rule {
        width: 132px;
        height: 3px;
        margin: 18px 0 16px;
        border-radius: 2px;
        background: linear-gradient(90deg, #35d0ff 0%, #a855f7 55%, #ff8a3d 100%);
      }
      .tag {
        font-size: 13.5px;
        font-weight: 400;
        letter-spacing: 0.2px;
        color: rgba(255, 255, 255, 0.74);
      }
      .version {
        margin-top: 10px;
        font-size: 12.5px;
        letter-spacing: 0.5px;
        color: rgba(255, 255, 255, 0.6);
        font-variant-numeric: tabular-nums;
      }
      .credit {
        position: absolute;
        left: 53px;
        bottom: 30px;
        font-size: 12px;
        letter-spacing: 0.3px;
        color: rgba(255, 255, 255, 0.55);
      }
      .credit strong { font-weight: 600; color: rgba(255, 255, 255, 0.78); }
    </style>
  </head>
  <body>
    <div class="scrim"></div>
    <div class="wrap">
      <div class="name">MadY</div>
      <div class="rule"></div>
      <div class="tag">Scientific graphing &amp; statistics</div>
      <div class="version" id="version">&nbsp;</div>
    </div>
    <div class="credit">by <strong id="credit">Mikael Elias</strong></div>
  </body>
</html>
