# electron-builder config — the MadY Windows one-click installer and the macOS build.
#
# Prerequisites (run before `electron-builder`):
#   1. Freeze the stats engine:  npm run freeze-engine   (→ engines/py/dist/mady-engine/)
#   2. Build the app bundles:     electron-vite build     (→ apps/desktop/out/)
# The `dist` script chains both. `electron-builder --dir` skips the installer for
# fast iteration.
appId: com.mady.app
productName: MadY
copyright: Copyright © 2026 Mikael Elias — GNU GPL v3 or later

# electron is hoisted to the monorepo-root node_modules, so electron-builder can't
# discover its version from apps/desktop/node_modules — pin it explicitly. Keep in
# sync with the "electron" devDependency in package.json.
electronVersion: 42.4.1

directories:
  output: release
  # Note: not "build": the repo's .gitignore has a blanket `build/` rule for build output, and
  # buildResources is input (the icon) that must be committed. Named apart so the icon can
  # never be silently dropped from a fresh clone.
  buildResources: build-resources

# What goes inside the asar. The renderer + main/preload are pre-bundled by
# electron-vite into out/, so we ship out/ + package.json (electron-builder still
# auto-collects the app's production node_modules for main's externalized deps).
files:
  - out/**/*
  - package.json
  # MadY's own packages are bundled into out/ already — nothing loads them from node_modules.
  # Listed as dependencies, electron-builder would copy each one whole: TypeScript source, tests,
  # source maps and all.
  - "!node_modules/@mady{,/**}"

# The PyInstaller-frozen engine lives outside the asar (a native binary can't run
# from inside an archive) and is spawned by absolute path from
# process.resourcesPath/engine/ — see resolveEngine() in src/main/index.ts.
extraResources:
  - from: ../../engines/py/dist/mady-engine
    to: engine
  # The user manual as one self-contained HTML file (every image embedded as base64). It sits
  # outside the asar for the same reason the engine does — it is read by absolute path from
  # process.resourcesPath, by the "manual:read" handler behind Help > Save the manual...
  # It is generated and gitignored, so `npm run dist` regenerates it first. Packaging a
  # stale manual would ship pictures that do not match the installed program.
  - from: ../../docs/manual/MadY-Manual.html
    to: manual/MadY-Manual.html

asar: true

# Double-clicking a .mady file opens it in MadY. The installer registers the type for this user
# (Windows runs `MadY.exe "<file>"`; main/launchFile.ts reads it) and removes it on uninstall.
# No `icon`: the files then show MadY's own icon. Only the NSIS installer registers it — the
# portable zip has no install step, so there Windows keeps asking which program to use.
fileAssociations:
  - ext: mady
    name: MadY project
    description: MadY project
    role: Editor

win:
  # The app icon: window, taskbar, Alt-Tab, the installer, and both shortcuts.
  # Multi-resolution 16→256 — Windows picks a size per surface, and an .ico carrying only
  # one large frame gets downscaled by the shell at every small size, which is where an
  # icon looks worst.
  icon: build-resources/icon.ico
  # The portable zip says what it is; the installer has its own name under `nsis`.
  artifactName: ${productName}-${version}-win-portable.${ext}
  # The licences, beside MadY.exe where Electron's own LICENSE.electron.txt and LICENSES.chromium.html
  # already sit: MadY's licence (GPL-3.0-or-later — its text must go with every copy) and the notices
  # of everything MadY ships (THIRD-PARTY-NOTICES.md, generated by scripts/gen-third-party-notices.mjs).
  # A platform's list adds to the shared one; release-config.test.ts holds these lists.
  extraFiles:
    - from: ../../LICENSE
      to: LICENSE.txt
    - from: ../../THIRD-PARTY-NOTICES.md
      to: THIRD-PARTY-NOTICES.md
  target:
    # nsis  = the one-click installer (MadY-Setup-<v>.exe).
    # zip   = the portable build (MadY-<v>-win-portable.zip) — no install: unzip anywhere, run MadY.exe.
    #         (electron-builder always also leaves the raw folder in win-unpacked/.)
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  # The build is not code-signed, so Windows SmartScreen shows a warning on first run. Signing
  # takes an EV/OV certificate set through `certificateFile`/`signtoolOptions`.

# macOS — built on a Mac only: the PyInstaller engine above is frozen for the system it is built
# on, so a Windows machine cannot make the Mac one. `electron-builder --mac` (npm run dist:mac).
# Apple Silicon only: numpy and scipy publish no universal2 wheels, so one engine cannot serve
# both Mac architectures. The output lands in release/mac-arm64/.
mac:
  # Converted to the Mac's .icns at build time; the PNG is 1024 × 1024.
  icon: build-resources/icon.png
  # The same licences, in MadY.app/Contents/Resources: a signed app may hold nothing but code directly
  # in Contents/, and codesign refuses a plain file there.
  extraResources:
    - from: ../../LICENSE
      to: LICENSE.txt
    - from: ../../THIRD-PARTY-NOTICES.md
      to: THIRD-PARTY-NOTICES.md
    # Electron's and Chromium's licences: electron-builder deletes them from a Mac build (they are
    # outside the app there), so they come from Electron's own download.
    - from: ../../node_modules/electron/dist/LICENSE
      to: LICENSE.electron.txt
    - from: ../../node_modules/electron/dist/LICENSES.chromium.html
      to: LICENSES.chromium.html
  category: public.app-category.education
  # Ad-hoc signature: free, and enough for Apple Silicon to run the app — an unsigned app
  # downloaded there is refused as "damaged". The first launch still has to be allowed once in
  # System Settings ▸ Privacy & Security. Hardened runtime is off because, with an ad-hoc
  # signature, it refuses Electron's own pre-signed frameworks and the app does not start.
  # A Developer ID certificate replaces both settings.
  identity: "-"
  hardenedRuntime: false
  target:
    # dmg = drag MadY into Applications. zip = the same app, unzipped anywhere.
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

nsis:
  # No spaces in the file name: a GitHub release turns spaces into dots, so the name the README
  # gives would not match the download.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: true                       # true one-click: no wizard pages
  perMachine: false                    # per-user install → no UAC elevation prompt
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MadY
