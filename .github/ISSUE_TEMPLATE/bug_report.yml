name: Bug report
description: Something in MadY does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. **Help ▸ Report a bug…** inside MadY gathers the version and recent errors for you; you can attach the .zip it saves here.
        Please report security problems privately instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, including any message MadY showed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, step by step, from opening MadY.
      placeholder: |
        1. New datasheet (XY)
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: For a statistical result, the value you expected and where it comes from.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MadY version
      description: Help ▸ About MadY
      placeholder: "0.6.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11"
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: A small .mady file, data set or screenshot that shows the problem, if you can share one.
