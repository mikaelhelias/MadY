name: Feature request
description: Suggest a graph, an analysis or another improvement.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you want to do
      description: The graph, analysis or task, and what it is for.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: In MadY or elsewhere, and what is missing or awkward.
  - type: textarea
    id: example
    attributes:
      label: Example
      description: A picture of the graph you have in mind, a reference for the method, or sample data.
